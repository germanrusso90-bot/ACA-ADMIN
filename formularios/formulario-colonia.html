<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colonia 25 de Mayo · Condiciones económicas ACA</title></head><body style="background:#f4f1f8"><main id="form"></main><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const ECON_VERSION=1;
let ECON=[];
const econStyle=`<style>.econ{max-width:1100px;margin:20px auto;padding:24px;background:white;border-radius:16px;font:15px 'Segoe UI',sans-serif;color:#241338}.econ h2,.econ h3{margin:12px 0}.econ p{margin:10px 0;line-height:1.5}.econ label{display:block;margin:10px 0}.econ input,.econ select,.econ textarea{padding:9px;border:1px solid #bcb1c7;border-radius:6px;max-width:100%;box-sizing:border-box}.econ input:not([type=checkbox]),.econ textarea{width:100%}.econ button{padding:10px 15px;margin:6px;background:#4b2563;color:white;border:0;border-radius:7px;cursor:pointer}.econ fieldset{padding:16px;margin:16px 0;border:1px solid #ddd;border-radius:10px}.econ-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.econ .note{background:#fff8df;padding:12px}.econ table{width:100%;border-collapse:collapse}.econ td,.econ th{padding:10px;text-align:left;border-bottom:1px solid #ddd}@media print{.econ button,.topbar,.tabs{display:none}}</style>`;
const FUELS=['infinia_diesel','super','infinia','diesel500'];
function blankEconomic(cr='3611'){return {schema:1,cr,vigencia:'',responsable:'',email:'',observaciones:'',full:{enabled:true,pct:null,excludeCigarettes:true},yer:Object.fromEntries(FUELS.map(f=>[f,{mode:"porcentaje",value:null}])),concepts:[['energia','Energía eléctrica','us'],['aguas','Agua','us'],['telefono','Teléfono','us'],['canon','Canon servicios','us'],['hotel','Hotel','hotel']].map(([id,name,area])=>({id,name,area,enabled:true,mode:id==='canon'?'litros':id==='hotel'?'factura':'porcentaje',pct:null,litros:null,vat:null,deductIVA:false,deductPercepciones:false,deductIntereses:false,base:'',medidor:'',notes:''}))};}
function checkEconomic(c){
 if(!c||c.schema!==1||!/^\d{4}$/.test(c.cr)||!/^\d{4}-(0[1-9]|1[0-2])$/.test(c.vigencia))throw Error('Completá CR y mes de vigencia.');
 if(!c.responsable?.trim()||!/^\S+@\S+\.\S+$/.test(c.email))throw Error('Completá responsable y correo de Google.');
 const num=(v,name,max=Infinity)=>{if(typeof v!=='number'||!Number.isFinite(v)||v<0||v>max)throw Error('Valor inválido: '+name);};
 if(c.full?.enabled)num(c.full.pct,'porcentaje Full',100);
 FUELS.forEach(f=>{const r=c.yer?.[f];if(!r||!['porcentaje','pesos_litro'].includes(r.mode))throw Error('Elegí modalidad YER '+f);num(r.value,'YER '+f,r.mode==='porcentaje'?100:Infinity);});c.full.excludeCigarettes=true;
 if(!Array.isArray(c.concepts)||c.concepts.length>100)throw Error('Conceptos inválidos.');
 const ids=new Set();c.concepts.forEach(x=>{if(!/^[a-zA-Z0-9_-]{1,80}$/.test(x.id)||ids.has(x.id))throw Error('Identificador de concepto inválido o repetido.');ids.add(x.id);if(!x.name?.trim()||!['us','hotel'].includes(x.area))throw Error('Nombre o área inválida.');if(!['porcentaje','factura','mixto','litros','total_menos_iva_percepciones'].includes(x.mode))throw Error('Modalidad inválida.');if(!x.enabled)return;if(['porcentaje','mixto'].includes(x.mode))num(x.pct,x.name+' porcentaje',100);if(x.mode==='litros')num(x.litros,x.name+' litros');num(x.vat,x.name+' IVA agregado',100);if(!x.base?.trim())throw Error('Detallá la base de cálculo de '+x.name);});return c;
}
function economicFor(period){return ECON.filter(c=>c.cr===CURRENT_CR&&c.vigencia<=period).sort((a,b)=>b.vigencia.localeCompare(a.vigencia))[0]||null;}
function fullRate(){const c=economicFor(prevMonth(CP));if(c){if(!c.full.enabled)throw Error('Full no aplica a esta estación.');return c.full.pct/100;}if(CURRENT_CR==='3531')return .12;throw Error('Cargá las condiciones económicas antes de calcular Full.');}
function fullBase(total,cig){const c=economicFor(prevMonth(CP));return total-cig;}
async function loadEconomic(){const raw=await sGet('economic:versions');ECON=raw?JSON.parse(raw):[];if(!Array.isArray(ECON))throw Error('Configuración inválida.');ECON.forEach(checkEconomic);}
function econDownload(name,value){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function field(label,key,value,type='text'){return `<label>${esc(label)}<input data-k="${key}" type="${type}" value="${esc(value??'')}" ${type==='number'?'min="0" step="any"':''}></label>`;}
function checkbox(label,key,value){return `<label><input type="checkbox" data-k="${key}" ${value?'checked':''}> ${esc(label)}</label>`;}
function selectField(label,key,value,opts){return `<label>${label}<select data-k="${key}">${opts.map(([v,n])=>`<option value="${v}" ${v===value?'selected':''}>${n}</option>`).join('')}</select></label>`;}
function getFields(el){const out={};el.querySelectorAll('[data-k]').forEach(x=>out[x.dataset.k]=x.type==='checkbox'?x.checked:x.type==='number'?(x.value===''?null:Number(x.value)):x.value.trim());return out;}
function mountEconomic(el,initial,onSave){
 let draft=structuredClone(initial);
 function collect(){const head=getFields(el.querySelector('#ec-head'));return {...draft,...head,full:getFields(el.querySelector('#ec-full')),yer:Object.fromEntries(FUELS.map(f=>[f,{mode:el.querySelector('#yer-mode').value,value:Number(el.querySelector('[data-rate="'+f+'"] [data-k="value"]').value)}])),concepts:[...el.querySelectorAll('[data-concept]')].map((x,i)=>({...draft.concepts[i],...getFields(x)}))};}
 function adaptFields(){el.querySelectorAll('[data-concept]').forEach(box=>{const mode=box.querySelector('[data-k="mode"]').value;for(const [key,show]of [['pct',['porcentaje','mixto'].includes(mode)],['litros',mode==='litros'],['deductIVA',['porcentaje','mixto'].includes(mode)],['deductPercepciones',['porcentaje','mixto'].includes(mode)],['deductIntereses',['porcentaje','mixto'].includes(mode)]]){const input=box.querySelector('[data-k="'+key+'"]');input.closest('label').hidden=!show;}box.querySelector('[data-k="mode"]').onchange=adaptFields;});}
 function paint(){el.innerHTML=econStyle+`<section class="econ"><h2>Colonia 25 de Mayo · Condiciones económicas</h2><p class="note">CR 3611. Los porcentajes YER provienen de la liquidación de agosto de 2026: confirmalos o corregilos según el acuerdo vigente. Los demás datos históricos de Colonia no se usaron. Indicá expresamente el IVA a agregar: 0 si no corresponde.</p><p>Completá los valores del acuerdo vigente. El correo informado no habilita acceso: cada persona debe ingresar con Google y esperar aprobación. Para dos medidores, agregá un concepto por medidor. Podés agregar tasas municipales u otros recuperos propios.</p><p class="note">Los campos vacíos no se interpretan como cero. Indicá 0 cuando corresponda y desmarcá los conceptos que no aplican. En modalidad mixta, factura y porcentaje se suman sobre bases distintas que debés describir para evitar duplicaciones.</p><form id="ec-form"><fieldset id="ec-head"><legend>Datos de la estación</legend><div class="econ-grid">${field('CR','cr',draft.cr)}<label>Responsable<input data-k="responsable" type="text" placeholder="Nombre y apellido" value="${esc(draft.responsable??'')}"></label>${field('Cuenta de Google a autorizar','email',draft.email,'email')}</div></fieldset><fieldset id="ec-full"><legend>Full · porcentaje de facturación</legend>${checkbox('Aplica Full','enabled',draft.full.enabled)}${field('Porcentaje','pct',draft.full.pct,'number')}<p>Base: facturación menos cigarrillos. Se aplica a todas las estaciones.</p></fieldset><fieldset id="ec-yer"><legend>YER · mismo proceso y dos Excel para todas las estaciones</legend>${selectField('Modalidad para todos los productos','yer-mode',draft.yer.super.mode,[['porcentaje','Porcentaje de venta'],['pesos_litro','Pesos por litro']]).replace('data-k="yer-mode"','id="yer-mode"')}<div class="econ-grid">${FUELS.map(f=>`<div data-rate="${f}"><h3>${({infinia_diesel:'Infinia Diesel',super:'Súper',infinia:'Infinia',diesel500:'Diesel 500'})[f]}</h3>${field('Valor de la comisión','value',draft.yer[f].value,'number')}</div>`).join('')}</div><p>La modalidad elegida se aplica a los cuatro productos. Porcentaje: importe de venta × porcentaje, sin deducciones. Pesos por litro: litros vendidos × comisión.</p></fieldset><div id="ec-concepts">${draft.concepts.map((c,i)=>`<fieldset data-concept="${i}"><legend>Recupero ${i+1}</legend>${checkbox('Aplica','enabled',c.enabled)}<div class="econ-grid">${field('Nombre','name',c.name)}${selectField('Área','area',c.area,[['us','Unidad Servicial'],['hotel','Hotel']])}${field('Medidor / cuenta / proveedor','medidor',c.medidor)}${selectField('Modalidad','mode',c.mode,[['porcentaje','Porcentaje de base'],['factura','Importe de factura'],['mixto','Factura + porcentaje (se suman)'],['litros','Litros × precio combustible'],['total_menos_iva_percepciones','Importe total menos IVA menos percepciones']])}${field('Porcentaje','pct',c.pct,'number')}${field('Litros pactados','litros',c.litros,'number')}${field('IVA a agregar al recupero (%)','vat',c.vat,'number')}</div>${checkbox('Deducir IVA de la base','deductIVA',c.deductIVA)}${checkbox('Deducir percepciones de la base','deductPercepciones',c.deductPercepciones)}${checkbox('Deducir intereses de la base','deductIntereses',c.deductIntereses)}${field('Base de cálculo / componentes de la modalidad mixta / combustible','base',c.base)}${field('Observaciones / notas de crédito / particularidades del acuerdo','notes',c.notes)}</fieldset>`).join('')}</div><button type="button" id="ec-add">+ Agregar medidor o recupero propio</button><p>Hotel: indicá si se liquida por factura, porcentaje o ambos. Si hay notas de crédito o ajustes, detallá su tratamiento en Observaciones.</p><p>Cancelaciones y Checks mantienen el mismo funcionamiento en todas las estaciones.</p><label><input type="checkbox" id="confirmed" required> Revisé las condiciones y confirmé los porcentajes YER.</label><button type="submit">Descargar formulario completo (JSON)</button>${onSave?'<button type="button" id="ec-save">Aplicar condiciones a esta estación</button>':''}<button type="button" id="ec-import">Importar formulario JSON</button><input type="file" id="ec-file" accept=".json,application/json" hidden><button type="button" onclick="window.print()">Imprimir / guardar PDF</button><p id="ec-status" role="status"></p></form></section>`;
 el.querySelector('#ec-head .econ-grid').insertAdjacentHTML('beforeend',field('Observaciones generales','observaciones',draft.observaciones||''));
 el.querySelectorAll('[data-concept]').forEach((box,i)=>{const select=box.querySelector('[data-k="mode"]');const selected=draft.concepts[i].mode==='total_menos_iva_percepciones';select.add(new Option('Importe total menos IVA menos percepciones','total_menos_iva_percepciones',selected,selected));});
 el.querySelector('#ec-add').onclick=()=>{draft=collect();draft.concepts.push({id:'extra_'+crypto.randomUUID().replaceAll('-',''),name:'',area:'us',enabled:true,mode:'porcentaje',pct:null,litros:null,vat:0,base:'',medidor:'',notes:''});paint();};
 adaptFields();el.querySelector('#ec-head [data-k="cr"]').readOnly=true;
 const status=msg=>el.querySelector('#ec-status').textContent=msg;
 el.querySelector('#ec-form').onsubmit=e=>{e.preventDefault();try{if(!el.querySelector('#confirmed').checked)throw Error('Confirmá que revisaste las condiciones.');draft=checkEconomic(collect());econDownload('condiciones-'+draft.cr+'.json',draft);status('Formulario descargado. Enviáselo al administrador.');}catch(e){status(e.message);}};
 el.querySelector('#ec-import').onclick=()=>el.querySelector('#ec-file').click();
 el.querySelector('#ec-file').onchange=async e=>{try{if(e.target.files[0].size>250000)throw Error('Archivo demasiado grande.');const imported=checkEconomic(JSON.parse(await e.target.files[0].text()));if(imported.cr!=='3611')throw Error('Este formulario corresponde a Colonia, CR 3611.');draft=imported;paint();status('Formulario leído. Revisalo antes de aplicarlo.');}catch(e){status(e.message);}};
 if(onSave)el.querySelector('#ec-save').onclick=async()=>{try{draft=checkEconomic(collect());await onSave(draft);status('Condiciones guardadas. Las liquidaciones existentes conservan su cálculo.');}catch(e){status(e.message);}};
 }
 paint();
}

const initial=blankEconomic('3611');initial.vigencia=new Date().toISOString().slice(0,7);const verifiedRates={"infinia_diesel": 6.34, "super": 9.85, "infinia": 10.62, "diesel500": 5.72};for(const [fuel,value]of Object.entries(verifiedRates))initial.yer[fuel]={mode:'porcentaje',value};mountEconomic(document.getElementById('form'),initial,null);</script></body></html>
